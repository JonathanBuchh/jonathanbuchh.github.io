<!DOCTYPE html>
<html lang=en>
	<head>
	<title>buchh.fun</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Jonathan Buchholz's fun projects">
	<style>
	body {
	  max-width: 920px;
	  margin: auto;
	  padding: 1.5em;
	  font-family: -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
	  line-height: 1.3;
	  text-align: justify;
	  background: #fff;
	  color: #212529;
        }
	a {
  	  color: #0242f2;
	  text-decoration: underline;
	}
	a:hover {
	  color: #0056b3;
	  text-decoration: none;
	}
	.projects {
	  display: grid;
	  grid-template-columns: repeat(3,1fr);
	  grid-gap: 30px;
	}
	.projects .project img {
	    display: block;
	    margin-bottom: 10px;
	    width: 100%;
	    max-width: 640px;
	    border-radius: 5px;
	}
	@media screen and (max-width:480px) {
	    .projects {
		grid-template-columns: repeat(1,1fr);
	    }
	}
	@media screen and (max-width:640px) {
	    .projects {
		grid-template-columns: repeat(2,1fr);
	    }
	}
	@media (prefers-color-scheme: dark) {
	  body {
	    background: #212529;
	    color: #f8f9fa;
	  }
	  a {
	    color: #3395ff;
	  }
	}
	</style>
	</head>
<body>
	<h1>buchh.fun</h1>
	<div class="projects">
	    <div class="project">
	        <a href="/wordle"><img alt="Wordle logo" src="/images/wordle.png"></a>
	        <p><a href="/wordle"><strong>Wordle</strong></a>: Essentially a carbon copy of Josh Wardle's Wordle circa Janurary 31<sup>st</sup>, 2022</p>
	    </div>
	    <div class="project">
	        <a href="/boatavg"><img alt="boatavg logo" src="/images/boatavg.png"></a>
		<p><a href="/boatavg"><strong>boatavg</strong></a>: Easily calculate your crew's average 2k</p>
	    </div>
	</div>
	<small>Made with ♡ by <a href="https://buchh.org">Jonathan Buchholz</a> for the open web.</small>
</body>
</html>
